<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>handy</title>
  </head>

  <body>
    <!--
      Diagnostic chrome: a visible "OpenWhisper booting…" splash that the
      WebView renders even before the React bundle finishes parsing.
      Plus a global error sink so any synchronous module-load error
      writes itself ON THE PAGE instead of disappearing into the
      release-build void. Both elements are removed by main.tsx once
      React.createRoot succeeds — see main.tsx for the cleanup.
    -->
    <div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0044ff;color:#fff;font-family:Segoe UI,system-ui,sans-serif;gap:12px;z-index:2147483647;pointer-events:none">
      <div style="font-size:18px;font-weight:600">OpenWhisper</div>
      <div id="boot-status" style="font-size:13px;opacity:0.75">Loading…</div>
      <div id="boot-error" style="display:none;max-width:560px;padding:12px 16px;margin-top:16px;border:1px solid #b00;background:#330000;color:#fdd;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;overflow:auto;max-height:70vh"></div>
    </div>
    <script>
      // Capture synchronous errors during module load and paint them
      // into #boot-error so the user (and us) can see why React never
      // mounted. Runs BEFORE the module script tag below.
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-error");
          if (!el) return;
          el.style.display = "block";
          el.textContent = (el.textContent || "") + msg + "\n";
          var status = document.getElementById("boot-status");
          if (status) status.textContent = "Failed to start — see error below";
        }
        window.addEventListener("error", function (e) {
          show(
            "Error: " + (e.message || "(no message)") +
            "\n  at " + (e.filename || "?") + ":" + (e.lineno || "?") + ":" + (e.colno || "?") +
            (e.error && e.error.stack ? "\n" + e.error.stack : "")
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          show("Unhandled promise rejection: " + (e.reason && e.reason.stack || e.reason || "(unknown)"));
        });
        // Set status as a heartbeat so we know the inline script ran.
        var s = document.getElementById("boot-status");
        if (s) s.textContent = "HTML loaded — waiting for React bundle…";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
