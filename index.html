<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>handy</title>
  </head>

  <body>
    <!--
      Minimal boot splash + global error sink. Splash is removed by main.tsx
      once React.createRoot succeeds. The error sink stays armed for the
      lifetime of the page — if a runtime JS error fires later, we paint it
      into #boot-error rather than letting the page silently break.

      Phase Final.Web kept this after the white-screen debugging session:
      the diagnostic flow (visible status during boot + visible errors when
      something goes wrong) is genuinely useful for end-users running an
      unsigned binary they downloaded off the web.
    -->
    <div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1c1b1a;color:#e8e8e8;font-family:Segoe UI,system-ui,sans-serif;gap:12px;z-index:2147483647;pointer-events:none">
      <div style="font-size:18px;font-weight:600">OpenWhisper</div>
      <div id="boot-status" style="font-size:13px;opacity:0.7">Loading…</div>
      <div id="boot-error" style="display:none;max-width:560px;padding:12px 16px;margin-top:16px;border:1px solid #b00;background:#330000;color:#fdd;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;overflow:auto;max-height:70vh;pointer-events:auto"></div>
    </div>
    <script>
      // Global error sink: paints any uncaught JS error into #boot-error so
      // users running release builds without devtools can still see what
      // went wrong. Runs BEFORE the React bundle loads.
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-error");
          if (!el) return;
          el.style.display = "block";
          el.textContent = (el.textContent || "") + msg + "\n";
          var status = document.getElementById("boot-status");
          if (status) status.textContent = "Failed to start — see error below";
          // If the splash was already removed, re-anchor the error chrome.
          if (!document.getElementById("boot-splash")) {
            document.body.appendChild(el);
            el.style.position = "fixed";
            el.style.right = "12px";
            el.style.bottom = "12px";
            el.style.zIndex = "2147483647";
          }
        }
        window.addEventListener("error", function (e) {
          show(
            "Error: " + (e.message || "(no message)") +
            "\n  at " + (e.filename || "?") + ":" + (e.lineno || "?") + ":" + (e.colno || "?") +
            (e.error && e.error.stack ? "\n" + e.error.stack : "")
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          show("Unhandled promise rejection: " + (e.reason && e.reason.stack || e.reason || "(unknown)"));
        });
        var s = document.getElementById("boot-status");
        if (s) s.textContent = "HTML loaded — booting React…";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
